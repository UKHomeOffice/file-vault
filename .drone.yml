---
kind: pipeline
name: default
type: kubernetes

environment:
  IMAGE_URL: quay.io/ukhomeofficedigital
  IMAGE_REPO: file-vault

include_default_branch: &include_default_branch
  include:
    - master

include_default_and_feature_branches: &include_default_and_feature_branches
  include:
    - master
    - feature/*

node_image_name: &node_image_name quay.io/ukhomeofficedigital/hof-nodejs:24.21.0-alpine3.24-v5@sha256:110c8d92d27c94b5fd55a6442e884d42a835e3f59246e75dc8137afc20293414

node_image: &node_image
  pull: if-not-exists
  image: *node_image_name

linting: &linting
  <<: *node_image
  commands:
    - yarn run test:lint

unit_tests: &unit_tests
  <<: *node_image
  environment:
    NOTIFY_STUB: true
  commands:
    - yarn run test:unit

trigger:
  branch:
    <<: *include_default_and_feature_branches

steps:
  - name: setup
    <<: *node_image
    commands:
      - yarn install --frozen-lockfile
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [ push, pull_request, tag ]

  # Prevents an accidental Drone rerun from overwriting an existing release tag.
  # Failing early preserves the tag's original digest and keeps release references immutable.
  - name: check_tag_exists
    pull: if-not-exists
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    environment:
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
    commands:
      - >
        if [ -z "$${DRONE_TAG}" ]; then
          echo "Not a tag build; skipping tag existence check."
          exit 0
        fi
        docker login -u="ukhomeofficedigital+drone" -p=$${DOCKER_PASSWORD} quay.io
        if docker manifest inspect $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_TAG} >/dev/null 2>&1; then
          echo "Tag $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_TAG} already exists; refusing to overwrite it."
          exit 1
        fi
        echo "Tag $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_TAG} does not exist; continuing."
    when:
      branch: master
      event: [tag]
    depends_on:
      - setup

  - name: clone_repos
    image: alpine/git
    environment:
      DRONE_GIT_USERNAME:
        from_secret: drone_git_username
      DRONE_GIT_TOKEN:
        from_secret: drone_git_token
    commands:
      - git clone https://$${DRONE_GIT_USERNAME}:$${DRONE_GIT_TOKEN}@github.com/UKHomeOfficeForms/hof-services-config.git
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request, tag]

    # Trivy Security Scannner for scanning OS related vulnerabilities in Base image of Dockerfile
  - name: scan_base_image_os
    pull: always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: *node_image_name
      SERVICE_URL: https://acp-trivy-helm.acp-trivy.svc.cluster.local:443
      SEVERITY: MEDIUM,HIGH,CRITICAL --vuln-type os,library --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock
    when:
      event: [push, pull_request, tag]
    depends_on:
      - clone_repos

  - name: linting
    <<: *linting
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: unit_tests
    <<: *unit_tests
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: build_images
    pull: if-not-exists
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
    - /usr/local/bin/wait
    - docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
    - docker buildx create --use
    - docker buildx inspect --bootstrap
    - docker buildx build --platform linux/amd64 --load -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA}-amd64 .
    - docker buildx build --platform linux/arm64 --load -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA}-arm64 .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      branch: 
        <<: *include_default_and_feature_branches
      event: [ push, pull_request, tag ]
    depends_on:
      - setup
      - check_tag_exists

  - name: scan_node_packages_amd64
    pull: always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: file-vault:${DRONE_COMMIT_SHA}-amd64
      SEVERITY: MEDIUM,HIGH,CRITICAL --vuln-type os,library --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock
    when:
      event: [push, pull_request, tag]
    depends_on:
      - clone_repos
      - build_images

  - name: scan_node_packages_arm64
    pull: always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: file-vault:${DRONE_COMMIT_SHA}-arm64
      SEVERITY: MEDIUM,HIGH,CRITICAL --vuln-type os,library --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock
    when:
      event: [push, pull_request, tag]
    depends_on:
      - clone_repos
      - build_images

  - name: push_images_to_quay
    pull: if-not-exists
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    environment:
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
    commands:
    - docker login -u="ukhomeofficedigital+drone" -p=$${DOCKER_PASSWORD} quay.io
    - |
      for arch in amd64 arm64; do
        docker tag $${IMAGE_REPO}:$${DRONE_COMMIT_SHA}-$${arch} $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA}-$${arch}
        docker push $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA}-$${arch}
      done
    - >
      docker buildx imagetools create
      -t $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA}
      $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA}-amd64
      $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA}-arm64
    volumes:
      - name: dockersock
        path: /var/run
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [ push, pull_request, tag ]
    depends_on:
      - scan_node_packages_amd64
      - scan_node_packages_arm64

  # Automatically push Docker image to Quay when a Git tag is created on the master branch, Users should reference the image using the format: image_repo_url:tag@digestsha for immutability and traceability.
  - name: push_tag_to_quay
    pull: if-not-exists
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    environment:
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
    commands:
    - docker login -u="ukhomeofficedigital+drone" -p=$${DOCKER_PASSWORD} quay.io
    - docker buildx imagetools create -t $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_TAG} $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA}
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [tag]
    depends_on:
      - push_images_to_quay

  # CRON job steps that runs security scans using Trivy
  - name: cron_clone_repos
    image: alpine/git
    environment:
      DRONE_GIT_USERNAME:
        from_secret: drone_git_username
      DRONE_GIT_TOKEN:
        from_secret: drone_git_token
    commands:
      - git clone https://$${DRONE_GIT_USERNAME}:$${DRONE_GIT_TOKEN}@github.com/UKHomeOfficeForms/hof-services-config.git
      - find hof-services-config/* | grep -v $HOF_CONFIG | grep -v 'infrastructure' | xargs rm -rf
    when:
      cron: security_scans
      event: cron

  # CRON job steps that runs security scans using Trivy
  - name: cron_build_image
    pull: if-not-exists
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      - /usr/local/bin/wait
      - docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all
      - docker buildx create --use
      - docker buildx inspect --bootstrap
      - docker buildx build --no-cache --platform linux/amd64,linux/arm64 -t $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA} --push .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      cron: security_scans
      event: cron
    depends_on:
      - cron_clone_repos

  - name: cron_trivy_scan_image_os
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    pull: always
    environment:
      IMAGE_NAME: *node_image_name
      SERVICE_URL: https://acp-trivy-helm.acp-trivy.svc.cluster.local:443
      SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --vuln-type os,library --dependency-tree
      FAIL_ON_DETECTION: false
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    when:
      cron: security_scans
      event: cron
    depends_on:
      - cron_clone_repos

  - name: cron_trivy_scan_node_packages
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    pull: always
    environment:
      IMAGE_NAME: $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA}
      SERVICE_URL: https://acp-trivy-helm.acp-trivy.svc.cluster.local:443
      SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --vuln-type os,library --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    when:
      cron: security_scans
      event: cron
      status:
        - success
        - failure
    depends_on:
      - cron_build_image
      - cron_clone_repos

  - name: cron_notify_slack_security_scans
    pull: if-not-exists
    image: plugins/slack:1.4.1
    settings:
      channel: sas-hof-security
      failure: ignore
      icon.url: https://readme.drone.io/logo.svg
      template: >
            *✘ {{ uppercasefirst build.status }}*: CRON Job `security_scans` for *Node Base Image* has failed.

            Branch <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{build.branch}}> | Commit <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>

            IMAGE : `{{ build.tag }}`

            *Build <{{build.link}}|#{{build.number}}>*
      username: Drone_CI
      webhook:
        from_secret: slack_sas_hof_security_webhook
    when:
      cron: security_scans
      event: cron
      status:
        - failure
    depends_on:
      - cron_trivy_scan_image_os
      - cron_trivy_scan_node_packages

services:
  - name: docker
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind

volumes:
  - name: dockersock
    temp: {}
...
