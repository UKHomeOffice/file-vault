services:
  app:
    build: .
    environment:
      - HOST=localhost
      - PORT=3000
      - CLAMAV_REST_URL=http://clamav-rest:9000/scan
      - AWS_ACCESS_KEY_ID=aws-access-key-id
      - AWS_SECRET_ACCESS_KEY=aws-secret-access-key
      - AWS_REGION=eu-west-1
      - AWS_SIGNATURE_VERSION=v4
      - AWS_BUCKET=aws-bucket
      - AWS_ENDPOINT=http://local-s3:80
      - AWS_EXPIRY_TIME=600
      - AWS_PASSWORD=aws-password
      - NODE_ENV=development
      - ALLOW_GENERATE_LINK_ROUTE=no
      - FILE_EXTENSION_WHITELIST=gif,jpg,jpeg,png,pdf
    depends_on:
      clamav-rest:
        condition: service_healthy
    ports:
      - "3000:3000"

  nginx-proxy:
    profiles: ["proxy"]
    image: quay.io/ukhomeofficedigital/nginx-proxy:v4.4.8
    environment:
      - PROXY_SERVICE_HOST=proxy
      - PROXY_SERVICE_PORT=3001
      - NAXSI_USE_DEFAULT_RULES=FALSE
      - ADD_NGINX_SERVER_CFG=add_header Cache-Control private;add_header X-Frame-Options "SAMEORIGIN" always;add_header X-Content-Type-Options "nosniff" always;add_header X-XSS-Protection "1; mode=block" always;
      - ERROR_REDIRECT_CODES=599
    ports:
      - "443:443"
      - "80:80"

  proxy:
    profiles: ["proxy"]
    image: quay.io/ukhomeofficedigital/go-keycloak-proxy:v2.0.3-schema2
    environment:
      - PROXY_CLIENT_SECERT=proxy-client-secret
      - PROXY_CLIENT_ID=proxy-client-id
      - PROXY_DISCOVERY_URL=realm-url
      - PROXY_LISTEN=proxy:3001
      - PROXY_REDIRECTION_URL=https://localhost
      - PROXY_UPSTREAM_URL=http://app:3000
      - PROXY_REVOCATION_URL=revocation-url
    entrypoint:
      - /opt/keycloak-proxy
      - --resources=uri=/|methods=GET|roles=caseworkers
      - --log-requests=true
      - --json-format=true
      - --verbose
    ports:
      - "3001:3001"

  clamav-rest:
    image: ajilaag/clamav-rest:0.5.3
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "8080:9000"

  local-s3:
    image: luofuxiang/local-s3:latest
    ports:
      - "127.0.0.1:9080:80"
    volumes:
      - local-s3-data:/data

  local-s3-init:
    image: amazon/aws-cli:2.17.43
    depends_on:
      - local-s3
    environment:
      - AWS_ACCESS_KEY_ID=aws-access-key-id
      - AWS_SECRET_ACCESS_KEY=aws-secret-access-key
      - AWS_DEFAULT_REGION=eu-west-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://local-s3:80 s3api list-buckets >/dev/null 2>&1; do
          sleep 1
        done

        if aws --endpoint-url http://local-s3:80 s3api head-bucket --bucket aws-bucket >/dev/null 2>&1; then
          echo "Bucket aws-bucket already exists"
        else
          aws --endpoint-url http://local-s3:80 s3api create-bucket --bucket aws-bucket >/dev/null
          echo "Bucket aws-bucket created"
        fi

        echo "Bucket aws-bucket is ready"

volumes:
  local-s3-data:
